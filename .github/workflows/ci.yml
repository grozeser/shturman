name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Бэкенд — линтер, тесты, эталонный прогон
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
        working-directory: .
      - run: pytest -q
      - name: Метрики качества агента на эталонном наборе
        run: python -m app.eval --min-completed 0.9
        env:
          TODAY: '2026-10-24'
          DATABASE_URL: sqlite:///eval.db

  frontend:
    name: Фронтенд — типы и сборка
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker — сборка и запуск из чистого клона
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:8080/health
      - run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
