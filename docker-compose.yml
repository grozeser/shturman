name: shturman

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shturman}
      POSTGRES_USER: ${POSTGRES_USER:-shturman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shturman}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    # platform: linux/amd64  # раскомментируйте, если нужен amd64-образ на Apple Silicon (по умолчанию собирается нативно)
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shturman}:${POSTGRES_PASSWORD:-shturman}@db:5432/${POSTGRES_DB:-shturman}
    ports:
      - "${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # для локальной LLM (Ollama, vLLM) на хост-машине
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Telegram-бот на том же ядре агента: TELEGRAM_BOT_TOKEN в .env и docker compose --profile telegram up --build
  bot:
    build: .
    profiles: [telegram]
    command: ["python", "-m", "app.bot"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shturman}:${POSTGRES_PASSWORD:-shturman}@db:5432/${POSTGRES_DB:-shturman}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
